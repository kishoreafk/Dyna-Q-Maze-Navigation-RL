<!DOCTYPE html>

<head>

<div class="slide" style="padding:64px;display:flex;flex-direction:column;">

    <h1 style="font-family:var(--font-heading);font-size:62px;font-weight:600;line-height:1.08;letter-spacing:-0.015em;margin:24px 0 0;color:var(--primary);">

      <span class="mutedc" style="font-size:13.5px;">Empirical Evidence</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px;border-left:2px solid var(--accent);padding-left:14px;">
      <span class="num" style="font-size:12px;color:var(--accent);">03</span>
      <span style="font-size:13.5px;color:var(--primary);font-weight:500;">Deliverables &amp; Limits</span>
